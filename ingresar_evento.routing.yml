ingresar_evento.formulario:
  path: '/evento'
  defaults:
    _form: '\Drupal\ingresar_evento\Form\IngresarEventoForm'
    _title: 'Registrar Nuevo Item para DSpace'
  requirements:
    _permission: 'access content'
    
ingresar_evento.detalle:
  path: '/admin/ver-evento/{evento_id}'
  defaults:
    _controller: '\Drupal\ingresar_evento\Controller\EventoDetalleController::detalle'
    _title: 'Detalle del Evento'
  requirements:
    _permission: 'administer ingresar_evento'

ingresar_evento.moderacion:
  path: '/admin/dspace-moderacion'
  defaults:
    _controller: '\Drupal\ingresar_evento\Controller\ModeracionController::listar'
    _title: 'Moderación de Envíos a DSpace 9'
  requirements:
    _permission: 'administer ingresar_evento'

ingresar_evento.enviar_dspace:
  path: '/admin/dspace-moderacion/enviar/{id}'
  defaults:
    _controller: '\Drupal\ingresar_evento\Controller\ModeracionController::enviarADSpace'
  requirements:
    _permission: 'administer ingresar_evento'
    _csrf_token: 'TRUE'

