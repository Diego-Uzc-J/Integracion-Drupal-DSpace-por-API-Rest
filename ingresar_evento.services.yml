services:
  logger.channel.ingresar_evento:
    parent: logger.channel_base
    arguments: ['ingresar_evento']
  ingresar_evento.event_image_generator:
    class: Drupal\ingresar_evento\Services\EventImageGenerator
    arguments: ['%app.root%']
  ingresar_evento.dspace_connector:
    class: Drupal\ingresar_evento\Services\DSpaceConnectorService
    arguments: ['@http_client', '@file_system', '@logger.channel.ingresar_evento', '@messenger', '@string_translation']
